<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="A floating ceramic bell with soft alert cards around it — illustrative image">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1ec"/>
      <stop offset="1" stop-color="#f1e9ef"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece5dd"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6a68f"/>
      <stop offset="1" stop-color="#ef8368"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6a68f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6a68f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#9a8078" flood-opacity="0.26"/>
    </filter>
    <filter id="soft4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9a8078" flood-opacity="0.2"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg2)"/>

  <!-- glow -->
  <circle cx="320" cy="300" r="220" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="320" cy="486" rx="150" ry="34" fill="#a08b84" opacity="0.3" filter="url(#blur2)"/>

  <!-- bell -->
  <g filter="url(#soft3)">
    <path d="M320 132
             c-66 0 -108 48 -108 116
             c0 54 -18 88 -42 112
             h300
             c-24 -24 -42 -58 -42 -112
             c0 -68 -42 -116 -108 -116 z"
          fill="url(#bell)" stroke="#e3dad0" stroke-width="3"/>
    <path d="M320 132 c-66 0 -108 48 -108 116 c0 54 -18 88 -42 112 h96 c-14 -30 -20 -66 -20 -108 c0 -62 -12 -94 -26 -120 z"
          fill="#ffffff" opacity="0.65"/>
    <!-- bell knob -->
    <path d="M286 384 a34 30 0 0 0 68 0 z" fill="#e3dad0"/>
    <ellipse cx="320" cy="384" rx="34" ry="8" fill="#d8cec3"/>
    <!-- tepesi -->
    <circle cx="320" cy="124" r="16" fill="#ece5dd" stroke="#e3dad0" stroke-width="3"/>
  </g>

  <!-- top right alert card -->
  <g filter="url(#soft4)" transform="rotate(7 496 176)">
    <rect x="418" y="126" width="176" height="96" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <rect x="418" y="126" width="8" height="96" rx="4" fill="url(#coral)"/>
    <rect x="444" y="152" width="92" height="9" rx="4.5" fill="#d9d2cc"/>
    <rect x="444" y="172" width="126" height="9" rx="4.5" fill="#ece7e2"/>
    <text x="444" y="207" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#c25a3f">High · 248</text>
  </g>

  <!-- bottom left alert card -->
  <g filter="url(#soft4)" transform="rotate(-6 148 400)">
    <rect x="56" y="348" width="180" height="96" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <rect x="56" y="348" width="8" height="96" rx="4" fill="#8fb8e8"/>
    <rect x="82" y="374" width="86" height="9" rx="4.5" fill="#d9d2cc"/>
    <rect x="82" y="394" width="120" height="9" rx="4.5" fill="#ece7e2"/>
    <text x="82" y="429" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#3f6fa8">Low · 64</text>
  </g>

  <!-- bottom right small card: silent -->
  <g filter="url(#soft4)" transform="rotate(5 492 428)">
    <rect x="418" y="382" width="158" height="80" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <rect x="442" y="406" width="74" height="9" rx="4.5" fill="#d9d2cc"/>
    <rect x="442" y="426" width="106" height="9" rx="4.5" fill="#ece7e2"/>
    <circle cx="552" cy="404" r="8" fill="#8fd6bd"/>
  </g>

  <!-- decorative dots -->
  <g fill="#cbb9b2">
    <circle cx="120" cy="212" r="7" opacity="0.6"/>
    <circle cx="152" cy="240" r="5" opacity="0.45"/>
    <circle cx="540" cy="540" r="7" opacity="0.5"/>
  </g>
</svg>
