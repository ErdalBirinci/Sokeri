<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="A sensor disc and three floating glass cards carrying a line chart — illustrative image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1ec"/>
      <stop offset="1" stop-color="#e9efe9"/>
    </linearGradient>
    <linearGradient id="discTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e4dd"/>
    </linearGradient>
    <linearGradient id="discSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d2c8"/>
      <stop offset="1" stop-color="#bcb5a9"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd6bd"/>
      <stop offset="1" stop-color="#5cbfa0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7d8a7f" flood-opacity="0.28"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7d8a7f" flood-opacity="0.2"/>
    </filter>
    <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- ground shadow -->
  <ellipse cx="330" cy="472" rx="176" ry="40" fill="#8b968b" opacity="0.28" filter="url(#blurShadow)"/>

  <!-- sensor disc -->
  <g filter="url(#soft)">
    <path d="M150 430 v-34 a180 78 0 0 0 360 0 v34 a180 78 0 0 1 -360 0 z" fill="url(#discSide)"/>
    <ellipse cx="330" cy="396" rx="180" ry="78" fill="url(#discTop)"/>
    <ellipse cx="330" cy="390" rx="140" ry="58" fill="#f7f5f1"/>
    <ellipse cx="330" cy="388" rx="140" ry="58" fill="none" stroke="#ded8ce" stroke-width="2"/>
    <!-- thin pulse line on the disc -->
    <path d="M210 392 h58 l14 -20 l18 40 l16 -28 l14 8 h88" fill="none" stroke="url(#mint)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="330" cy="396" rx="180" ry="78" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- floating glass card: top right, with chart -->
  <g filter="url(#soft2)" transform="rotate(6 470 190)">
    <rect x="376" y="112" width="212" height="140" rx="16" fill="url(#glassA)" stroke="#ffffff" stroke-width="2"/>
    <rect x="396" y="134" width="74" height="9" rx="4.5" fill="#cfd8d2"/>
    <rect x="396" y="152" width="46" height="9" rx="4.5" fill="#e2e8e4"/>
    <path d="M396 224 L428 206 L456 214 L486 182 L516 192 L548 160 L570 168"
          fill="none" stroke="#5cbfa0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M396 224 L428 206 L456 214 L486 182 L516 192 L548 160 L570 168 L570 234 L396 234 Z"
          fill="#8fd6bd" opacity="0.18"/>
    <circle cx="548" cy="160" r="6" fill="#3fa98a"/>
  </g>

  <!-- floating glass card: top left, with value -->
  <g filter="url(#soft2)" transform="rotate(-7 168 210)">
    <rect x="64" y="140" width="176" height="128" rx="16" fill="url(#glassA)" stroke="#ffffff" stroke-width="2"/>
    <rect x="86" y="164" width="60" height="9" rx="4.5" fill="#cfd8d2"/>
    <text x="86" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#2c3430" letter-spacing="-1">112</text>
    <text x="86" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#7b857f">mg/dL</text>
    <circle cx="214" cy="170" r="9" fill="#5cbfa0"/>
  </g>

  <!-- floating glass card: bottom right, with trend arrow -->
  <g filter="url(#soft2)" transform="rotate(4 468 356)">
    <rect x="392" y="300" width="168" height="104" rx="16" fill="url(#glassA)" stroke="#ffffff" stroke-width="2"/>
    <rect x="412" y="322" width="56" height="9" rx="4.5" fill="#cfd8d2"/>
    <!-- steady trend arrow -->
    <g stroke="#2c3430" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="418" y1="368" x2="470" y2="368"/>
      <polyline points="452,352 470,368 452,384"/>
    </g>
    <text x="490" y="376" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#2c3430">steady</text>
  </g>

  <!-- small decorative molecule dots -->
  <g fill="#b9c7bd">
    <circle cx="120" cy="330" r="7" opacity="0.7"/>
    <circle cx="152" cy="356" r="5" opacity="0.55"/>
    <circle cx="560" cy="470" r="8" opacity="0.6"/>
    <circle cx="528" cy="496" r="5" opacity="0.45"/>
  </g>
</svg>
